<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563f0" />
    <title>乐云企业网盘</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#2563f0'/><g fill='#fff'><circle cx='11.8' cy='15.4' r='5.8'/><circle cx='20.6' cy='15.9' r='5.2'/><circle cx='16' cy='10.6' r='6.2'/><rect x='6' y='15' width='20.6' height='6.3' rx='3.15'/></g><rect x='9.6' y='23.6' width='13' height='3.4' rx='1.7' fill='#fff' opacity='.55'/></svg>"
    />
    <style>
      /* 首屏骨架：避免 JS 加载期间出现白屏闪烁 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        font: 14px/1.6 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #8a93a5;
      }
      #app-loading .dot {
        width: 8px;
        height: 8px;
        margin: 0 3px;
        border-radius: 50%;
        background: #2563f0;
        display: inline-block;
        animation: ly-bounce 1.2s infinite ease-in-out both;
      }
      #app-loading .dot:nth-child(2) { animation-delay: -1s; }
      #app-loading .dot:nth-child(3) { animation-delay: -0.8s; }
      @keyframes ly-bounce {
        0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
