<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5eff" />
    <title>乐云企业网盘</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5eff'/%3E%3Cpath d='M9 20.5a4 4 0 0 1 .6-7.95 5.6 5.6 0 0 1 10.9-1.2A4.4 4.4 0 0 1 23 20.5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      /* 首屏骨架：避免 JS 加载期间出现白屏闪烁 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8fb;
        font: 14px/1.6 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #8a93a5;
      }
      #app-loading .dot {
        width: 8px;
        height: 8px;
        margin: 0 3px;
        border-radius: 50%;
        background: #1f5eff;
        display: inline-block;
        animation: ly-bounce 1.2s infinite ease-in-out both;
      }
      #app-loading .dot:nth-child(2) { animation-delay: -1s; }
      #app-loading .dot:nth-child(3) { animation-delay: -0.8s; }
      @keyframes ly-bounce {
        0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
